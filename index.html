
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusWork · AI Training Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07090e;
      --surface: #0f141c;
      --surface-2: #141b26;
      --border: #1e2a38;
      --border-light: #2a3b50;
      --text: #e8eef7;
      --text-dim: #8598b3;
      --text-dimmer: #5f7590;
      --accent: #2f7cff;
      --accent-light: #5c9dff;
      --accent-glow: rgba(47, 124, 255, 0.35);
      --green: #1fd1a0;
      --green-dim: #0e6b52;
      --yellow: #f9c74f;
      --red: #ff5c7c;
      --purple: #9d6bff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 15% 5%, rgba(47, 124, 255, 0.08) 0%, transparent 35%),
                  radial-gradient(circle at 85% 90%, rgba(157, 107, 255, 0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ========== TOP NAV ========== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 9, 14, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
    }

    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(145deg, var(--accent), #00aaff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 6px 16px -4px var(--accent-glow);
    }

    .brand-text {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #b7d3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-text span {
      font-weight: 400;
      font-size: 14px;
      -webkit-text-fill-color: var(--text-dim);
      color: var(--text-dim);
      margin-left: 3px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      transition: 0.15s;
      border: none;
      background: none;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--surface);
    }

    .nav-link.active {
      color: var(--accent-light);
      background: rgba(47, 124, 255, 0.1);
    }

    .nav-link i { font-size: 13px; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .balance-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
    }

    .balance-chip i { font-size: 12px; }

    .btn {
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 18px;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.1px;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(145deg, #2f7cff, #1a5fd9);
      color: #fff;
      box-shadow: 0 8px 20px -8px var(--accent-glow);
    }

    .btn-primary:hover { background: linear-gradient(145deg, #3f8aff, #2a6fe9); }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { background: var(--surface); color: var(--text); border-color: var(--border-light); }

    .btn-green {
      background: linear-gradient(145deg, #1fd1a0, #10a37a);
      color: #04140f;
      box-shadow: 0 8px 20px -8px rgba(31, 209, 160, 0.4);
    }

    .btn-green:hover { background: linear-gradient(145deg, #2ee0af, #1ab889); }

    .btn-sm { padding: 8px 14px; font-size: 12.5px; border-radius: 9px; }

    .avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2f7cff, #9d6bff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      border: 2px solid var(--border-light);
      transition: 0.15s;
      flex-shrink: 0;
    }

    .avatar-btn:hover { border-color: var(--accent); }

    /* ========== MAIN ========== */
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 28px 60px;
      position: relative;
      z-index: 1;
    }

    .page { display: none; animation: fadeUp 0.35s ease; }
    .page.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== AUTH SCREEN ========== */
    .auth-wrap {
      max-width: 440px;
      margin: 40px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 34px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--accent), #00aaff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      margin: 0 auto 18px;
      box-shadow: 0 12px 28px -8px var(--accent-glow);
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      text-align: center;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--text-dim);
      text-align: center;
      margin: 6px 0 26px;
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 9px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s;
    }

    .tab.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      color: var(--text-dimmer);
      font-size: 14px;
      pointer-events: none;
    }

    .input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px 12px 40px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.15s;
    }

    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47, 124, 255, 0.12); }

    .input::placeholder { color: var(--text-dimmer); }

    .auth-error {
      background: rgba(255, 92, 124, 0.08);
      border: 1px solid rgba(255, 92, 124, 0.25);
      color: #ff8ca1;
      font-size: 12.5px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }

    .auth-error.show { display: block; }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 22px;
      font-size: 12.5px;
    }

    .link {
      color: var(--accent-light);
      cursor: pointer;
      font-weight: 500;
    }

    .link:hover { text-decoration: underline; }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .checkbox-wrap input { accent-color: var(--accent); cursor: pointer; }

    .auth-submit { width: 100%; padding: 13px; font-size: 14.5px; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      color: var(--text-dimmer);
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-demo {
      text-align: center;
      font-size: 12px;
      color: var(--text-dimmer);
      margin-top: 18px;
    }

    /* ========== DASHBOARD ========== */
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 26px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .page-title span { color: var(--text-dim); font-weight: 400; }

    .page-sub {
      font-size: 13.5px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      transition: 0.18s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); }

    .stat-label {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dimmer);
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }

    .stat-label i { font-size: 12px; color: var(--accent); }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }

    .stat-value.green { color: var(--green); }

    .stat-note {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-note i { font-size: 10px; color: var(--green); }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-head h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .section-head h2 i { color: var(--accent); font-size: 15px; }

    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-dim);
      cursor: pointer;
      transition: 0.15s;
    }

    .chip:hover { border-color: var(--border-light); color: var(--text); }

    .chip.active {
      background: rgba(47, 124, 255, 0.12);
      border-color: var(--accent);
      color: var(--accent-light);
    }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 12px; }

    .task-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: 0.18s;
      cursor: pointer;
    }

    .task-card:hover { border-color: var(--border-light); transform: translateX(3px); }

    .task-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .task-icon.image { background: rgba(47, 124, 255, 0.14); color: var(--accent-light); }
    .task-icon.text { background: rgba(31, 209, 160, 0.13); color: var(--green); }
    .task-icon.audio { background: rgba(249, 199, 79, 0.13); color: var(--yellow); }
    .task-icon.video { background: rgba(157, 107, 255, 0.14); color: var(--purple); }

    .task-body { flex: 1; min-width: 0; }

    .task-title {
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(31, 209, 160, 0.14);
      color: var(--green);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .task-badge.hot {
      background: rgba(255, 92, 124, 0.14);
      color: var(--red);
    }

    .task-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .task-meta span { display: flex; align-items: center; gap: 5px; }

    .task-meta i { font-size: 10px; color: var(--text-dimmer); }

    .task-reward {
      text-align: right;
      flex-shrink: 0;
    }

    .reward-amount {
      font-size: 17px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.4px;
    }

    .reward-label {
      font-size: 10.5px;
      color: var(--text-dimmer);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    /* Sidebar: payout + activity */
    .side-col { display: flex; flex-direction: column; gap: 22px; }

    .paypal-card {
      background: linear-gradient(150deg, #0d1a2e 0%, #101c30 60%, #0b1524 100%);
      border: 1px solid rgba(47, 124, 255, 0.22);
      border-radius: 22px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .paypal-card::after {
      content: '\f1ed';
      font-family: 'Font Awesome 6 Free';
      font-weight: 400;
      position: absolute;
      right: -10px;
      bottom: -20px;
      font-size: 120px;
      color: rgba(47, 124, 255, 0.06);
      pointer-events: none;
    }

    .paypal-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .paypal-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #003087;
      flex-shrink: 0;
    }

    .paypal-head h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .paypal-head p {
      font-size: 12px;
      color: var(--text-dim);
    }

    .paypal-status {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .paypal-status-left { display: flex; align-items: center; gap: 10px; }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      flex-shrink: 0;
    }

    .status-dot.linked {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .status-text {
      font-size: 12.5px;
      font-weight: 600;
    }

    .status-email {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .paypal-actions { display: flex; flex-direction: column; gap: 10px; }

    .payout-methods { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

    .payout-method {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12.5px;
    }

    .payout-method-left { display: flex; align-items: center; gap: 10px; color: var(--text-dim); }
    .payout-method-left i { width: 16px; text-align: center; color: var(--accent-light); }
    .payout-method-right { font-weight: 600; color: var(--text); }

    /* Activity */
    .activity-list { display: flex; flex-direction: column; gap: 2px; }

    .activity-item {
      display: flex;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .activity-item:last-child { border-bottom: none; padding-bottom: 0; }

    .activity-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      background: rgba(47, 124, 255, 0.1);
      color: var(--accent-light);
    }

    .activity-icon.earn { background: rgba(31, 209, 160, 0.1); color: var(--green); }
    .activity-icon.payout { background: rgba(157, 107, 255, 0.1); color: var(--purple); }

    .activity-body { flex: 1; min-width: 0; }

    .activity-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .activity-time { font-size: 11px; color: var(--text-dimmer); }

    .activity-amount { font-size: 13px; font-weight: 700; color: var(--green); flex-shrink: 0; }
    .activity-amount.out { color: var(--text-dim); }

    /* ========== TASK DETAIL MODAL ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-head {
      display: flex;
      justify-content: spa
